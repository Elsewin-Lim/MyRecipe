name: Sync Main to Dev

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
        contents: write
        pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Pull Request to Sync with main
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: auto-sync-main-to-dev
          base: dev
          branch-suffix: timestamp
          title: "🔄 Automated Sync: Main -> Dev"
          body: "This is an automatic Pull Request to keep the `dev` branch synchronized with the latest changes from `main`."