name: Sync Main to Dev

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create sync PR and enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$(git rev-list --count origin/dev..origin/main)" -eq 0 ]; then
            echo "dev already contains main; nothing to sync"
            exit 0
          fi

          number=$(gh pr list --base dev --head main --state open --json number --jq '.[0].number')
          if [ -z "$number" ]; then
            gh pr create --base dev --head main \
              --title "🔄 Automated Sync: Main -> Dev" \
              --body "Automatic sync of \`main\` into \`dev\`. Merge with a merge commit so history stays in sync."
            number=$(gh pr list --base dev --head main --state open --json number --jq '.[0].number')
          fi

          gh pr merge "$number" --auto --merge
