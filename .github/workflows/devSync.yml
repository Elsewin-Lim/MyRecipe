name: Sync Main to Dev

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Create Pull Request from main to dev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh pr create \
            --base dev \
            --head main \
            --title "🔄 Automated Sync: Main -> Dev" \
            --body "This is an automatic Pull Request to keep the \`dev\` branch synchronized with the latest changes from \`main\`." || echo "PR already exists or branches are already in sync."
