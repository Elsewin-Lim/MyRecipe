
name: Send Commits & CodeRabbit to Telegram

on:
  push:
    branches:
      - dev
      - main

  pull_request_review:
    types: [submitted]

  pull_request_review_comment:
    types: [created]

  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  notify-telegram:
    runs-on: ubuntu-latest

    steps:
      # Git Push / Commit Notification
      - name: Calculate Commit Count
        if: github.event_name == 'push'
        id: commits
        run: |
          echo "count=$(jq '.commits | length' "$GITHUB_EVENT_PATH")" >> "$GITHUB_OUTPUT"

      - name: Send Git Commit to Telegram
        if: github.event_name == 'push'
        uses: appleboy/telegram-action@v1
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: html
          message: |
            🚀 <b>New Push to Repository</b>

            📦 <b>Repository:</b>
            <a href="https://github.com/${{ github.repository }}">Open Repository</a>

            🌿 <b>Branch:</b> ${{ github.ref_name }}
            👤 <b>Author:</b> ${{ github.actor }}
            🔢 <b>Commits pushed:</b> ${{ steps.commits.outputs.count }}

            📝 <b>Latest Commit Message:</b>
            ${{ github.event.head_commit.message || 'No commit message available' }}

            🔑 <b>Commit SHA:</b>
            <code>${{ github.sha }}</code>

            🔗 <a href="https://github.com/${{ github.repository }}/commit/${{ github.sha }}">View This Commit</a>

            📋 <a href="${{ github.event.compare }}">View All Changes in This Push</a>

            📚 <a href="https://github.com/${{ github.repository }}/commits/${{ github.ref_name }}">View Branch Commit History</a>

      # CodeRabbit PR Review
      - name: Send CodeRabbit Review to Telegram
        if: >-
          github.event_name == 'pull_request_review' &&
          contains(github.event.review.user.login, 'coderabbit')
        uses: appleboy/telegram-action@v1
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: html
          message: |
            🐰 <b>CodeRabbit AI Review Completed</b>

            📦 <b>Repository:</b>
            <a href="https://github.com/${{ github.repository }}">Open Repository</a>

            🔀 <b>Pull Request:</b>
            <a href="${{ github.event.pull_request.html_url }}">#${{ github.event.pull_request.number }} - ${{ github.event.pull_request.title }}</a>

            🌿 <b>Target Branch:</b> ${{ github.event.pull_request.base.ref }}
            👤 <b>Reviewer:</b> ${{ github.event.review.user.login }}
            📌 <b>Review State:</b> ${{ github.event.review.state }}

            💬 <b>Review Summary:</b>
            ${{ github.event.review.body || 'No summary provided. Open the review to see details.' }}

            🔗 <a href="${{ github.event.review.html_url }}">View CodeRabbit Review</a>

            📋 <a href="${{ github.event.pull_request.html_url }}">View Pull Request</a>

      # CodeRabbit Inline Review Comment
      - name: Send CodeRabbit Inline Comment to Telegram
        if: >-
          github.event_name == 'pull_request_review_comment' &&
          contains(github.event.comment.user.login, 'coderabbit')
        uses: appleboy/telegram-action@v1
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: html
          message: |
            🐰 <b>CodeRabbit Inline Review Comment</b>

            📦 <b>Repository:</b>
            <a href="https://github.com/${{ github.repository }}">Open Repository</a>

            🔀 <b>Pull Request:</b>
            <a href="${{ github.event.pull_request.html_url }}">#${{ github.event.pull_request.number }} - ${{ github.event.pull_request.title }}</a>

            📄 <b>File:</b> <code>${{ github.event.comment.path }}</code>
            🔢 <b>Line:</b> ${{ github.event.comment.line || github.event.comment.original_line || 'Not specified' }}

            💬 <b>Comment:</b>
            ${{ github.event.comment.body }}

            🔗 <a href="${{ github.event.comment.html_url }}">View Inline Comment</a>

      # CodeRabbit General PR Comment
      - name: Send CodeRabbit General Comment to Telegram
        if: >-
          github.event_name == 'issue_comment' &&
          github.event.issue.pull_request &&
          contains(github.event.comment.user.login, 'coderabbit')
        uses: appleboy/telegram-action@v1
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: html
          message: |
            🐰 <b>CodeRabbit Pull Request Comment</b>

            📦 <b>Repository:</b>
            <a href="https://github.com/${{ github.repository }}">Open Repository</a>

            🔀 <b>Pull Request:</b>
            <a href="${{ github.event.issue.html_url }}">#${{ github.event.issue.number }} - ${{ github.event.issue.title }}</a>

            👤 <b>Comment Author:</b> ${{ github.event.comment.user.login }}

            💬 <b>Comment:</b>
            ${{ github.event.comment.body }}

            🔗 <a href="${{ github.event.comment.html_url }}">View Comment</a>
