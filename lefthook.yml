# Lefthook Git Hooks Configuration
pre-commit:
  parallel: true
  commands:
    # 1. Automatically format code before it hits staging
    prettier:
      glob: '*.{js,jsx,ts,tsx,css,json,md}'
      run: npx prettier --write {staged_files} && git add {staged_files}

    # 2. Run the code linter to catch syntax errors or broken rules
    linter:
      glob: '*.{js,jsx}'
      run: npm run lint

pre-push:
  parallel: true
  commands:
    # 1. Automatically format code before it hits staging
    prettier:
      glob: '*.{js,jsx,ts,tsx,css,json,md}'
      run: npx prettier --write {staged_files} && git add {staged_files}

    # 2. Run the code linter to catch syntax errors or broken rules
    linter:
      glob: '*.{js,jsx}'
      run: npm run lint
